# QManager v2 — nginx vhost for qmanager2.octolabs.cloud
#
# WHY THIS FILE EXISTS
# This host shares a VPS with other apps. One of them (KTET) owns the
# `default_server` block, so any hostname without its own server_name block is
# served by KTET instead. That is why https://qmanager2.octolabs.cloud/ was
# showing KTET. Adding this file gives the hostname its own block; nginx matches
# server_name before falling back to default_server, so KTET needs no changes.
#
# ROUTING MODEL
# Verified against the live host: the API is mounted under /api, and the host
# root serves the Next.js frontend.
#
#   /api/*      -> qmanager2-api  (NestJS, :3001)   e.g. /api/auth/login
#   everything  -> qmanager2-web  (Next.js, :3000)  e.g. /login, /dashboard/*
#
# The trailing slash on `proxy_pass http://qmanager_api/;` strips the /api
# prefix, because Nest mounts its routes at the root (/auth/login, /quotations).
#
# Clients must therefore use https://qmanager2.octolabs.cloud/api as their API
# base URL — the bare host 404s against the web app. That applies to the iOS
# app (AppConfig.productionBaseURL) and to NEXT_PUBLIC_API_URL.
#
# INSTALL
#   scp deploy/nginx/qmanager2.octolabs.cloud.conf \
#       root@<vps>:/etc/nginx/sites-available/qmanager2.octolabs.cloud
#   ssh root@<vps> ln -s /etc/nginx/sites-available/qmanager2.octolabs.cloud \
#       /etc/nginx/sites-enabled/qmanager2.octolabs.cloud
#   ssh root@<vps> 'nginx -t && systemctl reload nginx'
#   ssh root@<vps> certbot --nginx -d qmanager2.octolabs.cloud
#
# VERIFY THE PORTS FIRST — another app on this box may already hold 3000:
#   pm2 list
#   ss -lntp | grep -E '3000|3001'

upstream qmanager_web {
    # PM2 process `qmanager2-web` (Next.js `next start`, default port 3000)
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream qmanager_api {
    # PM2 process `qmanager2-api` (NestJS, PORT env or default 3001)
    server 127.0.0.1:3001;
    keepalive 32;
}

# Shared proxy headers. The API sets `trust proxy`, so X-Forwarded-* is what
# makes rate limiting and the portal's IP capture see the real client address.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 80;
    listen [::]:80;
    server_name qmanager2.octolabs.cloud;

    # Leave ACME reachable over plain HTTP so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qmanager2.octolabs.cloud;

    # certbot --nginx rewrites these two lines to the real paths.
    ssl_certificate     /etc/letsencrypt/live/qmanager2.octolabs.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qmanager2.octolabs.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # The API accepts 50mb JSON bodies (base64 product images in quotations),
    # so nginx must not cap the request below that.
    client_max_body_size 50m;

    # PDF generation drives headless Chromium and can take a while.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_http_version 1.1;

    access_log /var/log/nginx/qmanager2.access.log;
    error_log  /var/log/nginx/qmanager2.error.log;

    # Compress proxied responses. The API also gzips itself (compression
    # middleware in main.ts), and nginx passes an already-encoded response
    # through untouched, so this is the safety net for anything upstream sends
    # uncompressed rather than a second pass over the same bytes.
    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        application/json application/javascript text/css text/plain
                      image/svg+xml application/xml font/woff2;

    # ── NestJS API under /api ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://qmanager_api/;
        proxy_set_header Connection "";
    }

    # ── Next.js immutable build assets ────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://qmanager_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js frontend (everything else, including /login, /dashboard/*,
    #    /verify/*, /render-pdf/* and the singular /portal/quotation pages) ────
    location / {
        proxy_pass http://qmanager_web;

        # Next.js HMR / websockets.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
